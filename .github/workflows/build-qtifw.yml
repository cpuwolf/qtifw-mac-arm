name: Build QtIFW 4.11.0 (macOS arm64)

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-14

    env:
      IFW_REF: "4.11.0"
      QT_VERSION: "6.8.3"
      RELEASE_ASSET: "qtifw-4.11.0-macos-arm64.zip"

    steps:
      - name: Checkout QtIFW Source
        uses: actions/checkout@v4
        with:
          repository: qtproject/installer-framework
          ref: ${{ env.IFW_REF }}

      - name: Install Dependencies
        run: |
          brew install ninja xz p7zip

      - name: Install Static Qt
        # 预编译 static Qt（universal）；解压到 ./qt_static 并把 bin 加入 PATH。
        # 包内无 qt5compat，下一步单独补编。
        uses: AllanChain/install-qt-static@v6.8.3-1

      - name: Fix relocatable qmake paths
        # zip 解压后 qmake 仍可能指向原构建 prefix，导致找不到 macx-clang。
        run: |
          QTDIR="${GITHUB_WORKSPACE}/qt_static"
          test -x "${QTDIR}/bin/qmake"
          test -d "${QTDIR}/mkspecs/macx-clang"
          printf '%s\n' '[Paths]' 'Prefix = ..' > "${QTDIR}/bin/qt.conf"
          echo "=== qmake -query ==="
          "${QTDIR}/bin/qmake" -query
          PREFIX="$("${QTDIR}/bin/qmake" -query QT_INSTALL_PREFIX)"
          test "${PREFIX}" = "${QTDIR}"
          test -d "${PREFIX}/mkspecs/macx-clang"
          echo "QTDIR=${QTDIR}" >> "$GITHUB_ENV"

      - name: Build qt5compat into static prefix
        run: |
          test -x "${QTDIR}/bin/qmake"
          test -x "${QTDIR}/bin/qt-cmake"
          git clone --depth 1 -b "${QT_VERSION}" \
            https://github.com/qt/qt5compat.git "${GITHUB_WORKSPACE}/qt5compat-src"
          "${QTDIR}/bin/qt-cmake" \
            -S "${GITHUB_WORKSPACE}/qt5compat-src" \
            -B "${GITHUB_WORKSPACE}/qt5compat-build" \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX="${QTDIR}"
          cmake --build "${GITHUB_WORKSPACE}/qt5compat-build" --parallel
          cmake --install "${GITHUB_WORKSPACE}/qt5compat-build"
          test -d "${QTDIR}/lib/cmake/Qt6Core5Compat"
          if [[ ! -x "${QTDIR}/bin/lrelease" ]]; then
            echo "IFW_DISABLE_TRANSLATIONS=1" >> "$GITHUB_ENV"
          fi

      - name: Build QtIFW
        # 4.11 官方构建系统是 qmake；静态/动态跟随所用 Qt。
        # Coin 在 macOS 上用静态 liblzma；Homebrew 头文件需显式传入。
        run: |
          BREW_PREFIX="$(brew --prefix)"
          XZ_PREFIX="$(brew --prefix xz)"
          LZMA_A="${XZ_PREFIX}/lib/liblzma.a"
          test -f "${LZMA_A}"
          mkdir -p build
          cd build
          "${QTDIR}/bin/qmake" \
            -spec macx-clang \
            "QMAKE_APPLE_DEVICE_ARCHS=arm64" \
            "CONFIG+=release" \
            "QMAKE_LFLAGS+=-Wl,-no_adhoc_codesign" \
            "IFW_LZMA_LIBRARY=${LZMA_A}" \
            "INCLUDEPATH+=${XZ_PREFIX}/include" \
            "INCLUDEPATH+=${BREW_PREFIX}/include" \
            "LIBS+=-L${XZ_PREFIX}/lib" \
            "LIBS+=-L${BREW_PREFIX}/lib" \
            ..
          make -j"$(sysctl -n hw.ncpu)"

      - name: Package Binaries
        # IFW 源码自带 dist/（README、config 等），勿往那里拷贝。
        run: |
          OUT="${GITHUB_WORKSPACE}/ifw-out"
          rm -rf "${OUT}"
          mkdir -p "${OUT}"
          for tool in binarycreator repogen archivegen devtool installerbase; do
            src="build/bin/${tool}"
            test -x "${src}"
            cp "${src}" "${OUT}/"
            strip -x "${OUT}/${tool}"
            # 去掉 ld 默认的 adhoc / linker-signed，便于后续用 Developer ID 重签
            codesign --remove-signature "${OUT}/${tool}" 2>/dev/null || true
            codesign --remove-signature --force "${OUT}/${tool}" 2>/dev/null || true
            echo "=== ${tool} ==="
            lipo -info "${OUT}/${tool}" || true
            file "${OUT}/${tool}"
            otool -L "${OUT}/${tool}"
            if otool -L "${OUT}/${tool}" | grep -E 'Qt[^ ]*\.framework|libQt6[^ ]*\.dylib'; then
              echo "::error::${tool} still links Qt dynamically"
              exit 1
            fi
            if codesign -dv "${OUT}/${tool}" 2>&1 | grep -qiE 'Signature=adhoc|linker-signed|Authority='; then
              echo "::error::${tool} still has a code signature"
              codesign -dv --verbose=4 "${OUT}/${tool}" 2>&1 || true
              exit 1
            fi
            codesign -dv --verbose=4 "${OUT}/${tool}" 2>&1 || true
          done
          (
            cd "${OUT}"
            zip -9 "${GITHUB_WORKSPACE}/${RELEASE_ASSET}" \
              binarycreator repogen archivegen devtool installerbase
          )
          ls -lh "${GITHUB_WORKSPACE}/${RELEASE_ASSET}"

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: qtifw-4.11.0-macos-arm64
          path: |
            ifw-out/
            ${{ env.RELEASE_ASSET }}
          if-no-files-found: error

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.RELEASE_ASSET }}
          generate_release_notes: true
          fail_on_unmatched_files: true
